# Change ctrl b to ctrl a as command button (prefix)
unbind C-b
set -g prefix C-a

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt+arrow without prefix
bind -n M-left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# resize panes using Alt+vim movements
bind -n ˚ resize-pane -U 5
bind -n ∆ resize-pane -D 5
bind -n ˙ resize-pane -L 5
bind -n ¬ resize-pane -R 5

# ctrl - t or t new window
unbind t
unbind C-t
bind-key t new-window
bind-key C-t new-window

# ctrl - w or w to kill panes
unbind w
unbind C-w
bind-key w kill-pane
bind-key C-w kill-pane

# prefix - pagedown : next window
unbind Pagedown
bind-key Pagedown next-window

# prefix - pageup : previous window
unbind Pageup
bind-key Pageup previous-window

# Self-explanatory, was motivated by issues swapping monitors and font size
setw -g aggressive-resize on

# Base index to 1 (not 0)
set -g base-index 1
set -g pane-base-index 1

set-option -g renumber-windows on

# Disable waiting time when pressing escape, for smoother Neovim usage.
set-option -s escape-time 0

##
# Styling
##

# gruvbox material colorscheme (mostly)
RED="#ea6962"
GREEN="#a9b665"
YELLOW="#d8a657"
BLUE="#7daea3"
BRIGHTBLUE="#5eacd3"
ORANGE="#ffa500"
MAGENTA="#d3869b"
CYAN="#89b482"
BLACK="#1d2021"
DARK_GRAY="#32302f"
LIGHT_GRAY="#4f4946"
BG="#32302f"
FG="#d4be98"

# Nerdfont characters
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"

# Colors
set -g default-terminal "screen-256color"
set -g status-style bg=${BG},fg=${FG}

# Show the window list horizontally centered
set-option -g status-justify centre

# Style and set contents of the left section
set-option -g status-left "\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_OPEN}\
#[fg=${ORANGE},bg=${LIGHT_GRAY}] @#{user} \
#[fg=${LIGHT_GRAY},bg=default]${TRIANGLE_CLOSE}\
"

# Style and set contents of the right section
set-option -g status-right "\
#[fg=${LIGHT_GRAY},bg=default]${TRIANGLE_OPEN}\
#[fg=${BRIGHTBLUE},bg=${LIGHT_GRAY}] #(date) \
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_CLOSE}\
"

# Set max length of left and right section
set-option -g status-left-length 200
set-option -g status-right-length 200

# Set update interval of status bar (for datetime)
set-option -g status-interval 1

# Style and set content for the inactive windows (spaces are intentional)
set-option -g window-status-format "\
  \
#[fg=#ff9900]#I\
 \
#[fg=${BRIGHTBLUE}]#W\
  \
"

# Style and set content for the active windows
set-option -g window-status-current-format "\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_OPEN}\
#[fg=${ORANGE},bg=${LIGHT_GRAY}][\
#[bold]#[fg=${ORANGE},bg=${LIGHT_GRAY}]#I\
 \
#[bold]#[fg=${BRIGHTBLUE},bg=${LIGHT_GRAY}]#W\
#[fg=${ORANGE},bg=${LIGHT_GRAY}]]\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_CLOSE}\
"

# Remove the separator between window list items as we already have spacing
set-option -g window-status-separator ""

set -g pane-active-border-style fg=green
set -g pane-border-style bg=default,fg=colour008

set -g pane-border-status "top"
set -g pane-border-format ""
